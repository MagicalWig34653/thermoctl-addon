---
name: thermoctl
version: "0.6.4"
slug: thermoctl
description: >-
  Sensorbasierte Heizungssteuerung mit Zeitplänen, eigener Anmeldung, REST-API
  und MCP-Server. Steuert eine echte Heizung.
url: "https://github.com/MagicalWig34653/thermoctl"

# aarch64 und amd64 -- die vom Projektinhaber entschiedenen Zielarchitekturen.
# armv7 ausdruecklich nicht (siehe Projekt-STATUS.md, Home-Assistant-Add-on-Eintrag).
arch:
  - amd64
  - aarch64

# Das Abbild, das .github/workflows/docker.yml im thermoctl-Hauptrepository baut und
# nach ghcr.io veroeffentlicht. Der Supervisor haengt selbst ":{version}" an -- die
# Versionsnummer oben muss deshalb zu einem tatsaechlich vorhandenen Tag passen
# (type=semver in docker.yml, also z.B. "0.6.1" für den Git-Tag "v0.6.1").
image: "ghcr.io/magicalwig34653/thermoctl"

# thermoctl macht keinen Gebrauch von s6-Overlay-Diensten -- der eigene Entrypoint
# (docker/entrypoint.sh im Hauptrepository) ist bereits PID 1 und beendet sich sauber.
init: false

# Eigene Anmeldung: thermoctl hat eine eigene Benutzerverwaltung, unabhaengig von der
# Home-Assistant-Anmeldung. Siehe DOCS.md -- Ingress ersetzt sie nicht, man meldet sich
# zweimal an.
ingress: true
# Der Port, auf dem thermoctl im Container lauscht (Settings.bind_port, Vorgabe 8000).
# NICHT 0: Das hiesse "der Supervisor sucht sich einen freien Port aus", und ein Add-on
# muesste ihn zur Laufzeit bei ihm erfragen und darauf lauschen. thermoctl lauscht fest
# auf 8000 -- mit 0 zeigte der Ingress-Proxy auf einen Port, an dem niemand horcht, und
# Home Assistant meldete "Die App scheint noch nicht bereit zu sein".
ingress_port: 8000
panel_icon: mdi:radiator

# Web-App: startet als Reaktion auf Anfragen, keine feste, zeitkritische Systemaufgabe.
startup: application
boot: auto

# Damit der Supervisor die Zugangsdaten des Home-Assistant-eigenen MQTT-Brokers an das
# Add-on durchreichen kann, sobald jemand einen Zigbee2MQTT-/Mosquitto-Add-on parallel
# betreibt. Zugriff auf die dadurch freigegebenen Werte erfolgt über die
# Supervisor-API (/services/mqtt) -- das Uebernehmen in THERMOCTL_MQTT_* ist in dieser
# Fassung *nicht* automatisiert, siehe Auftragsbericht. Bis dahin traegt der Betreiber
# die MQTT-Optionen unten selbst ein, genau wie bei einer eigenstaendigen Instanz.
services:
  - "mqtt:want"

# -----------------------------------------------------------------------------------
# Optionen -- bewusst flach, ohne verschachtelte Gruppen.
#
# Der Supervisor prüft die *abgeschickte* Konfiguration gegen dieses Schema, und jede
# hier genannte Gruppe muss darin enthalten sein. Die Oberflaeche laesst eine Gruppe,
# in der nichts ausgefüllt ist, beim Speichern aber weg -- das Ergebnis war zweimal
# "Missing option '<gruppe>' in root", auch mit einer leeren Gruppe als Vorgabe. Ein
# flaches Feld mit "?" ist dagegen schlicht optional und kann nicht fehlen.
#
# Abgeleitet aus .env.example und thermoctl/config.py im Anwendungsprojekt, keine
# erfundenen Felder. THERMOCTL_BIND_HOST/_PORT und _SECURE_COOKIES fehlen bewusst:
# Bind-Adresse und Port sind Container-Interna hinter Ingress. THERMOCTL_ROOT_PATH
# ebenfalls -- den Ingress-Pfad ermittelt der Start selbst beim Supervisor.
# -----------------------------------------------------------------------------------
options:
  secret_key: ""
  log_level: info
  log_format: json
  database_type: sqlite
  mqtt_enabled: false
  mqtt_tls: false
  mqtt_client_id: thermoctl
  mqtt_base_topic: zigbee2mqtt
  mqtt_prefix: thermoctl

schema:
  # THERMOCTL_SECRET_KEY -- ohne ihn startet die Anwendung nicht (Settings.secret_key,
  # Field(min_length=32)). Als "password", damit der Supervisor ihn verdeckt anzeigt.
  secret_key: "password"
  log_level: "list(debug|info|warning|error)"
  log_format: "list(json|text)"

  # THERMOCTL_DATABASE_URL wird aus diesen Feldern zusammengesetzt. SQLite unter /data
  # ist die Vorgabe -- das ist das Datenverzeichnis des Add-ons, das der Supervisor
  # mitsichert. MariaDB braucht Host, Port, Benutzer, Passwort und Datenbanknamen.
  database_type: "list(sqlite|mariadb)"
  database_host: "str?"
  database_port: "port?"
  database_user: "str?"
  database_password: "password?"
  database_name: "str?"

  # THERMOCTL_MQTT_*. Insgesamt optional; eingeschaltet nimmt thermoctl darueber auch
  # Befehle entgegen, deshalb ein eigener Broker-Zugang. Die Client-ID gehört dazu,
  # weil ein Broker mit Rechteverwaltung seine Regeln haeufig daran bindet.
  mqtt_enabled: "bool"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_tls: "bool?"
  mqtt_ca_cert: "str?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_client_id: "str?"
  mqtt_base_topic: "str?"
  mqtt_prefix: "str?"

  # THERMOCTL_MEROSS_*. Ohne diese Angaben meldet sich der Adapter als "nicht
  # konfiguriert" und tut nichts.
  meross_email: "str?"
  meross_password: "password?"

  # THERMOCTL_NOTIFY_WEBHOOK[_TOKEN]. Ohne Adresse geht die Stoerungsmeldung nur ins Log.
  notify_webhook: "url?"
  notify_webhook_token: "password?"

  # Auffangnetz für alles, was hier nicht steht: eine .env, so wie man sie auch neben
  # docker compose legen würde -- eine Zuweisung je Zeile, Rautenzeichen leiten einen
  # Kommentar ein. Wird nach den Feldern oben angewandt und kann sie ueberschreiben;
  # eine von aussen gesetzte Umgebungsvariable gewinnt weiterhin gegen beides.
  env: "str?"
